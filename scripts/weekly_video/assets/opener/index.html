<!doctype html><html lang="en"><head><meta charset="utf-8"><script src="assets/gsap.min.js"></script><style>
@font-face{font-family:News;src:url('assets/font.ttf') format('truetype');font-weight:700}
*{box-sizing:border-box;margin:0}html,body{width:1920px;height:1080px;overflow:hidden;background:#101317}
#root{width:100%;height:100%;position:relative;perspective:1100px;font-family:News,sans-serif;color:#f1eee7}

</style></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080" data-fps="24">

<h1 id="title" class="clip" data-start="0" data-duration="4" data-track-index="1">MARKET MIND</h1><p id="sub" class="clip" data-start="0" data-duration="4" data-track-index="2">THE WEEK. THE NEXT MOVE.</p><div id="rule"></div><p id="dates" class="clip" data-start="0" data-duration="4" data-track-index="3">REVIEW OCT 5–9, 2026  ·  OUTLOOK OCT 12–16</p>

</div><script>
const tl=gsap.timeline({paused:true});
