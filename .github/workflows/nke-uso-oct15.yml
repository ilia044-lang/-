name: NKE + USO Shorts — Oct 15 at 23-30 Israel
on:
  schedule:
    # 2026-10-15 23:30 Asia/Jerusalem = 20:30 UTC.
    - cron: '30 20 15 10 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nke-uso-2026-10-15
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      PAIR_OUTPUT: /tmp/close-pair-2026-10-15
    steps:
      - name: Enforce one-time post-close production window
        id: gate
        run: |
          python - <<'PY'
          import datetime as dt,os
          from zoneinfo import ZoneInfo
          now=dt.datetime.now(dt.timezone.utc)
          start=dt.datetime(2026,10,15,23,30,tzinfo=ZoneInfo('Asia/Jerusalem'))
          authorized=start<=now<start+dt.timedelta(hours=12)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('run='+str(authorized).lower()+'\n')
          print('Requested start:',start.isoformat(),'Authorized now:',authorized)
          PY
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          ref: 46d20cd41b38b482c0f9844dbb7a4bb9b353957c
          path: source
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: source/scripts/weekly_video/requirements.txt
      - name: Install production dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core libsndfile1
          python -m pip install -r source/scripts/weekly_video/requirements.txt
          python -m pip check
      - uses: actions/cache@v4
        if: steps.gate.outputs.run == 'true'
        with:
          path: ~/.cache/stock-video
          key: kokoro-onnx-model-files-v1-0
      - name: Produce NKE using today's completed bar and fresh headlines
        if: steps.gate.outputs.run == 'true'
        run: python source/scripts/stock_video/close_pair.py --ticker NKE --out "$PAIR_OUTPUT/NKE"
      - name: Produce USO using today's completed bar and fresh headlines
        if: steps.gate.outputs.run == 'true'
        run: python source/scripts/stock_video/close_pair.py --ticker USO --out "$PAIR_OUTPUT/USO"
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: NKE-USO-2026-10-15-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/close-pair-2026-10-15/**
            !/tmp/close-pair-2026-10-15/**/chunks/**
            !/tmp/close-pair-2026-10-15/**/*.wav
      - uses: actions/checkout@v4
        if: success() && steps.gate.outputs.run == 'true'
        with:
          path: publish
      - name: Publish verified download files and completion summary
        if: success() && steps.gate.outputs.run == 'true'
        env:
          PUBLISH_REPO: ${{ github.workspace }}/publish
        run: python source/scripts/stock_video/publish_pair.py
